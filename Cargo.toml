[workspace]
resolver = "3"
members = ["audio-lib", "eq-plugin", "xtask"]

[workspace.dependencies]
assert_approx_eq = "1.1"
atomic_enum = "0.3.0"
dirs = "6.0"
eframe = "0.34"
egui = "0.34"
egui_plot = "0.35"
enum-table = "3.0"
more-asserts = "0.3"
nice-plug = { version = "0.1", features = [
    "assert_process_allocs",
    "standalone",
] }
nice-plug-egui = "0.1"
num = "0.4"
num-traits = "0.2"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_arrays = { version = "0.2" }
serde_json = "1.0"
smallvec = "1.15"

app-lib = { path = "app-lib" }
audio-lib = { path = "audio-lib" }
egui-lib = { path = "egui-lib" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
